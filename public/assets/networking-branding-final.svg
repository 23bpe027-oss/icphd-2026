<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Networking and branding illustration">
  <defs>
    <linearGradient id="coatBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d78b7"/>
      <stop offset="1" stop-color="#0b3b70"/>
    </linearGradient>
    <linearGradient id="jacketLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf7ff"/>
      <stop offset="1" stop-color="#8fc8e8"/>
    </linearGradient>
  </defs>

  <!-- soft network backdrop -->
  <g fill="none" stroke="#73d6f4" stroke-linecap="round" opacity=".9">
    <path d="M112 192 L176 130 L256 158 L336 130 L400 192" stroke-width="8"/>
    <path d="M112 192 L146 286 L222 326 L290 300 L366 326 L400 192" stroke-width="7"/>
    <path d="M176 130 L222 326 M256 158 L256 242 M336 130 L290 300" stroke-width="6"/>
  </g>
  <g fill="#8be3f8" stroke="#dff8ff" stroke-width="4">
    <circle cx="112" cy="192" r="13"/><circle cx="176" cy="130" r="13"/>
    <circle cx="256" cy="158" r="13"/><circle cx="336" cy="130" r="13"/>
    <circle cx="400" cy="192" r="13"/><circle cx="146" cy="286" r="13"/>
    <circle cx="222" cy="326" r="13"/><circle cx="290" cy="300" r="13"/>
    <circle cx="366" cy="326" r="13"/>
  </g>

  <!-- achievement / analytics badges -->
  <g>
    <circle cx="188" cy="112" r="38" fill="#f5fbff"/>
    <path d="M188 88 l8 14 16 3 -11 11 3 16 -16 -8 -15 8 3 -16 -11 -11 16 -3z" fill="#2a83b9"/>
    <circle cx="324" cy="112" r="38" fill="#f5fbff"/>
    <path d="M302 126h44" stroke="#2a83b9" stroke-width="6" stroke-linecap="round"/>
    <rect x="308" y="108" width="7" height="18" rx="2" fill="#2a83b9"/>
    <rect x="321" y="98" width="7" height="28" rx="2" fill="#2a83b9"/>
    <rect x="334" y="88" width="7" height="38" rx="2" fill="#2a83b9"/>
    <path d="M304 92 l12 8 12-12 12 4" fill="none" stroke="#13a9a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- left professional -->
  <g>
    <circle cx="188" cy="274" r="45" fill="#d9a77b"/>
    <path d="M148 270c2-42 74-55 82-2-11-8-20-10-32-8-18 3-31 12-50 10z" fill="#26364b"/>
    <path d="M139 392c8-71 33-92 49-92s42 21 49 92z" fill="url(#coatBlue)"/>
    <path d="M188 304l-20 34 20 54 20-54z" fill="#f7fbff"/>
    <path d="M174 338h28" stroke="#9bd8ef" stroke-width="6"/>
    <path d="M203 300l15 28-19 12" fill="none" stroke="#123f69" stroke-width="7"/>
  </g>

  <!-- right professional -->
  <g>
    <circle cx="324" cy="274" r="45" fill="#9c694d"/>
    <path d="M284 267c4-48 73-55 82-2-13-10-27-15-41-11-15 4-25 13-41 13z" fill="#1d2434"/>
    <path d="M273 392c8-71 34-92 51-92s43 21 51 92z" fill="url(#jacketLight)"/>
    <path d="M324 303l-17 34 17 51 18-51z" fill="#ffffff"/>
    <path d="M304 337h40" stroke="#2a83b9" stroke-width="6"/>
  </g>

  <!-- handshake -->
  <g stroke="#8b5a3c" stroke-linecap="round" stroke-linejoin="round">
    <path d="M206 347 C222 331 235 330 249 341 L263 353" fill="none" stroke-width="17"/>
    <path d="M306 347 C291 331 278 330 264 341 L249 353" fill="none" stroke-width="17"/>
    <path d="M242 350 C249 343 258 343 266 350 L280 361 C284 365 282 372 276 374 L264 371" fill="#b87951" stroke-width="5"/>
    <path d="M251 354 C258 361 264 365 271 369" fill="none" stroke="#f0c29b" stroke-width="5"/>
  </g>

  <!-- central connection point -->
  <circle cx="256" cy="242" r="28" fill="#9ee8fb" opacity=".28"/>
  <circle cx="256" cy="242" r="15" fill="#e7fbff"/>
  <circle cx="256" cy="242" r="7" fill="#4abbdc"/>
</svg>
