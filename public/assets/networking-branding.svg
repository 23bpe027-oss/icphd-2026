<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Networking and branding illustration">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3157"/>
      <stop offset="1" stop-color="#1d6fae"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff3ff"/>
      <stop offset="1" stop-color="#9fd8f2"/>
    </linearGradient>
  </defs>
  <!-- network lines -->
  <g fill="none" stroke="#1d6fae" stroke-width="5" stroke-linecap="round" opacity=".9">
    <path d="M72 74 L160 45 L248 74 L220 164 L160 190 L100 164 Z"/>
    <path d="M72 74 L100 164 M248 74 L220 164 M160 45 L160 190"/>
  </g>
  <g fill="#fff" stroke="#0b3157" stroke-width="5">
    <circle cx="72" cy="74" r="15"/><circle cx="160" cy="45" r="15"/><circle cx="248" cy="74" r="15"/>
    <circle cx="100" cy="164" r="15"/><circle cx="160" cy="190" r="15"/><circle cx="220" cy="164" r="15"/>
  </g>
  <!-- people -->
  <g stroke="#0b3157" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="124" cy="116" r="18" fill="#fff"/>
    <path d="M96 154 Q124 132 152 154 L146 177 H102 Z" fill="url(#light)"/>
    <circle cx="196" cy="116" r="18" fill="#fff"/>
    <path d="M168 154 Q196 132 224 154 L218 177 H174 Z" fill="#fff"/>
  </g>
  <!-- branding badge -->
  <g transform="translate(126 7)">
    <rect width="68" height="28" rx="14" fill="url(#blue)"/>
    <path d="M17 14 H50" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="17" cy="14" r="5" fill="#69c2ef"/>
    <circle cx="50" cy="14" r="5" fill="#20a48b"/>
  </g>
</svg>
